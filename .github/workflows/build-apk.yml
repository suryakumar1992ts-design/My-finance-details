name: Build Single HTML APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Set up JDK (Java Development Kit)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Build Capacitor and APK
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets --save-dev
        mkdir -p www
        cp index.html www/
        npx cap init SingleApp com.html.singleapp --web-dir www
        npx cap add android
        
        # ഇവിടെ ഐക്കൺ ജനറേറ്റ് ചെയ്യാനുള്ള കമാൻഡ് പ്രവർത്തിക്കും
        npx capacitor-assets generate --android --iconPath icon.png || true
        
        npx cap sync android
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
